<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara Remit</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }

    video {
      width: 100%;
      max-width: 600px;
      border-radius: 8px;
      background: #000;
    }

    canvas {
      display: none;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 50px;
      margin-top: 20px;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <h2>📸 Captura una idea</h2>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <button id="snapBtn">Sacar Foto y Enviar</button>
  <div id="status"></div>

  <script src="camera.js"></script>
</body>

</html>
