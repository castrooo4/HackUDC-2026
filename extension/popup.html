<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: sans-serif;
      background: #1a1a1a;
      color: white;
    }

    .hidden {
      display: none;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #222;
      color: white;
      box-sizing: border-box;
    }

    .auth-switch {
      font-size: 12px;
      color: #4CAF50;
      cursor: pointer;
      text-align: center;
      display: block;
      margin-top: 10px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #4CAF50;
    }

    input:checked+.slider:before {
      transform: translateX(14px);
    }
  </style>
</head>

<body>
  <h2 style="display: flex; align-items: center; gap: 8px;">🧠 Cerebro Remit</h2>

  <div id="authView">
    <div id="loginForm">
      <h3>Iniciar Sesión</h3>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPass" placeholder="Contraseña">
      <button id="loginBtn" style="background: #4CAF50;">Entrar</button>
      <span class="auth-switch" id="toRegister">¿No tienes cuenta? Regístrate</span>
    </div>

    <div id="registerForm" class="hidden">
      <h3>Crear Cuenta</h3>
      <input type="text" id="regName" placeholder="Nombre completo">
      <input type="email" id="regEmail" placeholder="Email">
      <input type="password" id="regPass" placeholder="Contraseña">
      <button id="registerBtn" style="background: #2196F3;">Registrarse</button>
      <span class="auth-switch" id="toLogin">Ya tengo cuenta</span>
    </div>
  </div>

  <div id="mainView" class="hidden">
    <textarea id="content" placeholder="Escribe tu nota o pega aquí una URL..." rows="3"
      style="width:100%; background:#222; color:white; border:1px solid #333; border-radius:4px; margin-bottom:10px;"></textarea>

    <div
      style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
      <span style="font-size: 13px; color: #ccc;">📍 Adjuntar mi ubicación</span>
      <label class="switch">
        <input type="checkbox" id="locationToggle">
        <span class="slider"></span>
      </label>
    </div>

    <button id="saveBtn" style="background: #4CAF50; width: 100%; padding: 10px; margin-bottom: 8px;">Enviar a
      Inbox</button>
    <button id="autoSaveBtn" style="background: #FF9800; width: 100%; padding: 10px; margin-bottom: 8px;">🚀 Guardar
      esta pestaña</button>
    <button id="screenshotBtn" style="background: #9C27B0; width: 100%; padding: 10px;">📸 Recortar y Guardar</button>
    <button id="openWebBtn"
      style="background: #2196F3; width: 100%; padding: 10px; border:none; border-radius:4px; color:white; font-weight:bold; cursor:pointer;">🌐
      Abrir Cerebro Digital</button>
    <button id="logoutBtn"
      style="background: transparent; border: 1px solid #ff4444; color: #ff4444; width: 100%; margin-top: 15px; font-size: 11px;">Cerrar
      Sesión</button>
  </div>

  <p id="status" style="text-align:center; font-size:12px; margin-top:10px;"></p>

  <script src="popup.js"></script>
</body>

</html>
