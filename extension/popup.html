<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remit Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="popup-root">
    <header class="popup-header">
      <h1 class="app-title"><span class="title-mark"></span>Cerebro Remit</h1>
      <p class="app-subtitle">Captura rapida y sincronizacion con tu inbox</p>
    </header>

    <section id="authView" class="view-card">
      <div id="loginForm" class="stack-md">
        <h2 class="section-title">Iniciar sesion</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPass" placeholder="Contrasena">
        <button id="loginBtn" class="btn btn-primary">Entrar</button>
        <button type="button" class="link-btn" id="toRegister">No tienes cuenta? Registrate</button>
      </div>

      <div id="registerForm" class="hidden stack-md">
        <h2 class="section-title">Crear cuenta</h2>
        <input type="text" id="regName" placeholder="Nombre completo">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Contrasena">
        <button id="registerBtn" class="btn btn-info">Registrarse</button>
        <button type="button" class="link-btn" id="toLogin">Ya tengo cuenta</button>
      </div>
    </section>

    <section id="mainView" class="view-card hidden">
      <textarea id="content" placeholder="Escribe tu nota o pega aqui una URL..." rows="4"></textarea>

      <div class="toggle-row">
        <span class="toggle-label">Adjuntar mi ubicacion</span>
        <label class="switch" for="locationToggle">
          <input type="checkbox" id="locationToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="actions stack-sm">
        <button id="saveBtn" class="btn btn-primary">Enviar a Inbox</button>
        <button id="autoSaveBtn" class="btn btn-warning">Guardar esta pestana</button>
        <button id="screenshotBtn" class="btn btn-accent">Recortar y guardar</button>
        <button id="openWebBtn" class="btn btn-secondary">Abrir Cerebro Digital</button>
        <button id="cameraBtn" class="btn btn-muted">Sacar foto</button>
      </div>

      <button id="logoutBtn" class="btn btn-ghost">Cerrar sesion</button>
    </section>

    <p id="status" class="status-line"></p>
  </main>

  <script src="popup.js"></script>
</body>

</html>
